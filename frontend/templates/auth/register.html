{% extends "base.html" %}

{% block title %}Cadastro · Coffee Time{% endblock %}

{% block content %}
<section class="auth-card">
  <p class="eyebrow">Primeiro pedido?</p>
  <h1>Crie sua conta</h1>

  <form method="post">
    {% if next_url %}<input type="hidden" name="next" value="{{ next_url }}">{% endif %}
    <label>
      Nome completo
      <input name="name" autocomplete="name" required>
    </label>

    <label>
      E-mail
      <input type="email" name="email" autocomplete="email" required>
    </label>

    <label>
      Celular
      <input type="tel" name="phone" autocomplete="tel" inputmode="numeric" maxlength="15" data-phone-mask required>
    </label>

    <label>
      Senha
      <span class="password-field"><input type="password" name="password" minlength="8" autocomplete="new-password"
          required><button class="password-toggle" type="button" aria-label="Mostrar senha" aria-pressed="false"><svg
            viewBox="0 0 24 24" aria-hidden="true">
            <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" />
            <circle cx="12" cy="12" r="3" />
          </svg></button></span>
      <small>Mínimo de 8 caracteres, com letras e números.</small>
    </label>

    <button class="button full" type="submit">Criar conta</button>
  </form>

  <p>Já tem conta? <a href="{{ url_for('auth.login', next=next_url) if next_url else url_for('auth.login') }}">Entrar</a></p>
</section>
{% endblock %}
