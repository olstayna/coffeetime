{% extends "base.html" %}{% block title %}Finalizar pedido · CoffeeTime{% endblock %}{% block content %}
<header class="page-title">
  <p class="eyebrow">Última etapa</p>
  <h1>Finalizar pedido</h1>
</header>
<div class="checkout-grid">
  <form id="checkout-form" method="post" class="panel form-grid">
    <h2>Endereço de entrega</h2><label class="wide">Rua <input name="street" required></label><label>Número <input
        name="number" required></label><label>CEP <input name="postal_code" inputmode="numeric" maxlength="9"
        placeholder="00000-000" data-cep-mask required></label><label>Bairro <input name="district"
        required></label><label>Cidade <input name="city" required></label><label class="wide">Observações<textarea
        name="notes" rows="3" placeholder="Apartamento, ponto de referência..."></textarea></label>
    <h2 class="wide">Pagamento</h2>
    <div class="payment wide"><label><input type="radio" name="payment_method" value="pix" required>
        PIX</label><label><input type="radio" name="payment_method" value="cartao"> Cartão na
        entrega</label><label><input type="radio" name="payment_method" value="dinheiro"> Dinheiro</label></div>
  </form>
  <aside class="summary" data-checkout-summary>
    {% include "shared/_checkout_summary.html" %}
  </aside>
</div>
{% endblock %}
